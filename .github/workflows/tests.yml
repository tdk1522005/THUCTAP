name: Python tests

on:
  push:
    branches: ["feature/gemini-live-web"]
  pull_request:
    branches: ["feature/gemini-live-web"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-gemini.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-gemini.txt
      - name: Run tests
        run: python -m pytest tests/ -q
